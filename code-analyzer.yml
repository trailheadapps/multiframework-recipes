ignores:
  files:
    - "**/react-recipes/**"
    - "**/angular-recipes/**"
    - "**/dist/**"
    - "**/node_modules/**"
    - "**/coverage/**"
    - "**/build/**"

rules:
  flow:
    # Disabled HardCodedId rule for flow as a temporary workaround for
    # https://github.com/forcedotcom/code-analyzer/issues/1947
    HardCodedId:
      severity: Critical
      tags: []
  eslint:
    # The only CSS scanned lives under microfrontend-recipes/lwc (react-recipes
    # is ignored above), and its few hardcoded values (65ch, 42rem, 0.9375rem,
    # 40px, 120px) are ones the SLDS linter itself reports have no replacement
    # styling hook — unfixable layout values, not defects.
    "@salesforce-ux/slds/no-hardcoded-values-slds2":
      disabled: true

engines:
  eslint:
    auto_discover_eslint_config: true
    disable_javascript_base_config: true
    disable_lwc_base_config: true
    disable_typescript_base_config: true
