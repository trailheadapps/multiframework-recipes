name: Windows Build

on:
  workflow_call:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v7.0.0

      - name: "Setup Node"
        uses: actions/setup-node@v4.0.0
        with:
          node-version-file: "package.json"
          cache: npm
          cache-dependency-path: force-app/main/react-recipes/uiBundles/reactRecipes/package-lock.json

      - name: "Restore React app node_modules cache"
        id: cache-react-npm
        uses: actions/cache@v6.0.0
        with:
          path: force-app/main/react-recipes/uiBundles/reactRecipes/node_modules
          key: windows-react-npm-${{ hashFiles('force-app/main/react-recipes/uiBundles/reactRecipes/package-lock.json') }}

      - name: "Install React app dependencies"
        if: steps.cache-react-npm.outputs.cache-hit != 'true'
        run: npm ci --prefix force-app/main/react-recipes/uiBundles/reactRecipes

      - name: "Build React"
        run: npm run build
        working-directory: force-app/main/react-recipes/uiBundles/reactRecipes

      - name: "Test React"
        run: npm run test -- --run
        working-directory: force-app/main/react-recipes/uiBundles/reactRecipes

      - name: "Restore Angular app node_modules cache"
        id: cache-angular-npm
        uses: actions/cache@v6.0.0
        with:
          path: force-app/main/angular-recipes/uiBundles/angularRecipes/node_modules
          key: windows-angular-npm-${{ hashFiles('force-app/main/angular-recipes/uiBundles/angularRecipes/package-lock.json') }}

      - name: "Install Angular app dependencies"
        if: steps.cache-angular-npm.outputs.cache-hit != 'true'
        run: npm ci --prefix force-app/main/angular-recipes/uiBundles/angularRecipes

      - name: "Build Angular"
        run: npm run build
        working-directory: force-app/main/angular-recipes/uiBundles/angularRecipes

      - name: "Test Angular"
        run: npm test -- --watch=false
        working-directory: force-app/main/angular-recipes/uiBundles/angularRecipes
