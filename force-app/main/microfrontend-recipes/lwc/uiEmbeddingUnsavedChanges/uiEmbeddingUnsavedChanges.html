<template>
  <div
    class="recipe-body"
    ontrackdirtystate={handleTrackDirtyState}
    onguestsave={handleSave}
  >
    <div class="badge-row">
      <template lwc:if={isDirty}>
        <lightning-badge
          label="Unsaved changes"
          class="slds-theme_warning"
        ></lightning-badge>
      </template>
      <template lwc:else>
        <lightning-badge label="Saved"></lightning-badge>
      </template>
    </div>
    <div class="embed-grid">
      <div class="shell-container">
        <lightning-ui-embedding
          sandbox="allow-popups"
          shell-title="Unsaved Changes"
          src={computedSrc}
          props={account}
        ></lightning-ui-embedding>
      </div>
      <!-- Reads the getRecord wire (LDS cache), so it reflects what is actually
           saved on the Account — the guest form shows the draft, this shows the
           committed record. It only changes once Save persists. A card would be
           nested inside the accordion's card (SLDS suppresses the border), so
           use slds-box, the bordered-container primitive. -->
      <div class="slds-box">
        <h3
          class="slds-text-title_caps slds-var-m-bottom_small slds-grid slds-grid_vertical-align-center"
        >
          <lightning-icon
            icon-name="utility:save"
            size="xx-small"
            alternative-text="Saved"
            class="slds-var-m-right_x-small"
          ></lightning-icon>
          Saved on the record
        </h3>
        <dl class="slds-dl_horizontal">
          <dt class="slds-dl_horizontal__label slds-text-color_weak">Name</dt>
          <dd class="slds-dl_horizontal__detail">{savedName}</dd>
          <dt class="slds-dl_horizontal__label slds-text-color_weak">Rating</dt>
          <dd class="slds-dl_horizontal__detail">{savedRating}</dd>
          <dt class="slds-dl_horizontal__label slds-text-color_weak">Type</dt>
          <dd class="slds-dl_horizontal__detail">{savedType}</dd>
        </dl>
      </div>
    </div>
    <div class="recipe-footer">
      <p class="recipe-description">
        Edit the guest form. The React app calls viewSDK.markDirtyState() when
        values change; this LWC listens for trackdirtystate and updates the
        badge. Salesforce also warns before navigating away while dirty.
      </p>
      <div class="source-links">
        <a
          href="https://github.com/trailheadapps/multiframework-recipes/tree/main/force-app/main/microfrontend-recipes/lwc/uiEmbeddingUnsavedChanges"
          target="_blank"
          rel="noopener"
          class="view-source"
        >
          Host (uiEmbeddingUnsavedChanges)
          <lightning-icon
            icon-name="utility:new_window"
            size="xx-small"
            alternative-text="Opens in new tab"
            class="external-icon"
          ></lightning-icon>
        </a>
      </div>
    </div>
  </div>
</template>
