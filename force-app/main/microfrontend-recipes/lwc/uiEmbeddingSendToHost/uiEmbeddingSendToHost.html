<template>
  <div class="recipe-body">
    <div class="shell-container">
      <lightning-ui-embedding
        sandbox="allow-popups"
        shell-title="Send To Host"
        src={computedSrc}
        props={account}
        onscore={handleScore}
      ></lightning-ui-embedding>
    </div>

      </p>
      <div class="source-links">
        <a
          href="https://github.com/trailheadapps/multiframework-recipes/tree/main/force-app/main/microfrontend-recipes/lwc/uiEmbeddingSendToHost"
          target="_blank"
          rel="noopener"
          class="view-source"
        >
          Host (uiEmbeddingSendToHost)
          <lightning-icon
            icon-name="utility:new_window"
            size="xx-small"
            alternative-text="Opens in new tab"
            class="external-icon"
          ></lightning-icon>
        </a>
      </div>
    </div>
  </div>
</template>
