@if (error(); as error) {
	<p class="text-destructive">{{ error }}</p>
} @else if (account(); as account) {
	<p class="text-lg font-semibold mb-1">{{ account.name }}</p>

	<!-- Conditional rendering: show the industry badge or a fallback. -->
	@if (account.industry) {
		<span
			class="inline-flex items-center rounded-md border border-primary/20 bg-primary/10 px-2 py-0.5 text-xs font-medium text-primary"
		>
			{{ account.industry }}
		</span>
	} @else {
		<span
			class="inline-flex items-center rounded-md bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground"
		>
			No Industry Set
		</span>
	}
} @else {
	<p class="text-sm">Loading…</p>
}
