<main class="py-4">
	<div class="mb-5">
		<h1 class="text-2xl font-semibold tracking-tight">{{ header() }}</h1>
		<div class="mt-1.5 h-0.5 w-12 rounded-full bg-primary"></div>
	</div>

	<div class="grid grid-cols-[minmax(0,1fr)_minmax(0,4fr)] gap-5">
		<!-- Sidebar: recipe list -->
		<nav
			class="sticky top-20 h-[calc(100vh-9rem)] overflow-y-auto rounded-lg border border-primary/70 bg-card p-2"
			aria-label="Recipes"
		>
			<ul class="space-y-0.5 list-none">
				@for (recipe of recipes(); track recipe.name(); let i = $index) {
					<li>
						<button
							type="button"
							(click)="select(i)"
							class="w-full text-left px-3 py-2 text-sm rounded-md transition-colors"
							[class]="
								i === selectedIndex()
									? 'bg-primary text-primary-foreground font-medium shadow-sm'
									: 'text-muted-foreground hover:text-foreground hover:bg-accent'
							"
						>
							{{ recipe.name() }}
						</button>
					</li>
				}
			</ul>
		</nav>

		<!-- Main: selected recipe + its source -->
		@if (selected(); as selected) {
			<div
				class="grid items-start gap-5"
				[class]="
					codeExpanded()
						? 'grid-cols-[0fr_minmax(0,1fr)] !gap-0'
						: 'grid-cols-[minmax(0,1fr)_minmax(0,1fr)]'
				"
			>
				<div
					class="sticky top-20 h-[calc(100vh-9rem)] min-w-0 overflow-hidden rounded-xl"
					[class]="codeExpanded() ? 'opacity-0 pointer-events-none' : 'opacity-100 overflow-y-auto'"
				>
					<app-card class="min-h-full border border-primary/70 ring-0 shadow-none">
						<app-card-header>
							<app-card-title>{{ selected.name() }}</app-card-title>
							@if (selected.description()) {
								<app-card-description>{{ selected.description() }}</app-card-description>
							}
						</app-card-header>
						<app-card-content class="slds-card__body_inner">
							<ng-container [ngTemplateOutlet]="selected.templateRef" />
						</app-card-content>
					</app-card>
				</div>

				<div class="sticky top-20 h-[calc(100vh-9rem)]">
					<app-code-block
						[sources]="selected.sources()"
						[expanded]="codeExpanded()"
						(toggleExpand)="codeExpanded.set(!codeExpanded())"
					/>
				</div>
			</div>
		} @else {
			<p class="text-muted-foreground text-sm">No recipes yet.</p>
		}
	</div>
</main>
